# ASDD issue運用「あり(自動同期)」= mode B のワークフロー。
# plan.md への push をトリガーに、計画タスクを GitHub Issue へ投影する(AI 不要・決定的)。
#
# **このファイルは雛形であり、そのままコピーしない。** プレースホルダは設定から埋める:
#
#   python <plugin>/skills/asdd-setup/scripts/asdd_config.py render sync-issues \
#     > .github/workflows/asdd-sync-issues.yml
#
# 統合ブランチと、PR 運用時の --no-close-done は設定(specs/asdd.config.json)から決まる。
# 手でコピーして書き換える運用にすると、どちらかが既定のまま残る事故が起きる。
# 加えて scripts/project_plan_to_issues.py を .github/scripts/ にコピーする(CI から参照するため)。
#
# **このワークフローは統合ブランチへ直接 push する。** そのブランチに必須ステータスチェックを
# 付けると bot の push も拒否されうるので、保護は Ruleset で行い bypass list に
# GitHub Actions を入れること(classic の branch protection には bypass が無い)。
#
# 前提(リポジトリ側の権限。GITHUB_TOKEN の上限はリポジトリ設定が決め、下の permissions はその中で絞る):
#   - Settings > Actions > General > Workflow permissions を "Read and write permissions" にする
#     (既定の read-only のままだと、下で issues:write を宣言しても 403 Resource not accessible で失敗する)。
#     gh で設定する場合:
#       gh api -X PUT repos/<owner>/<repo>/actions/permissions/workflow \
#         -f default_workflow_permissions=write -F can_approve_pull_request_reviews=true
#   - PR 運用も併用するなら、同じ画面の "Allow GitHub Actions to create and approve pull requests" を有効化する
#     (これは permissions キーでは上書きできない独立トグル)。
#   - 組織/Enterprise が read-only を強制していてリポジトリ側で上げられない場合は、GITHUB_TOKEN の代わりに
#     fine-grained PAT(Issues: RW, Contents: RW)か GitHub App トークンを secret にし、下の env: GH_TOKEN を差し替える。
#   - fork からの pull_request で起動した場合、GITHUB_TOKEN は設定に関わらず常に読み取り専用(mode B は自リポジトリへの
#     push トリガーなので通常は問題ない)。
name: ASDD sync issues

on:
  push:
    branches: [dev]
    paths: ["specs/**/plan.md"]

permissions:
  contents: write              # issue 番号を plan.md へ書き戻すため
  issues: write                # Issue の作成・更新・close のため

concurrency:                   # 連続 push でも同期を直列化(取り合い防止)
  # index 同期と Issue 投影は同じ push で起動し、どちらも統合ブランチへ書き戻すため
  # **同じグループで直列化する**(別グループだと同時に push して片方が弾かれる)
  group: asdd-writeback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project each approved plan to issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fatal=0
          flagged=0
          for plan in specs/*/plan.md; do
            [ -f "$plan" ] || continue
            echo "::group::$plan"
            python .github/scripts/project_plan_to_issues.py "$plan" --apply --no-close-done
            rc=$?
            echo "::endgroup::"
            # exit 2 = 要確認の不整合(renumber 疑い等)。それ以外の非ゼロは致命的
            if [ "$rc" = "2" ]; then flagged=1; elif [ "$rc" != "0" ]; then fatal=$rc; fi
          done
          if [ "$flagged" = "1" ]; then
            echo "::warning::plan.md と Issue に要確認の不整合があります(ログの『要確認』を参照)"
          fi
          exit $fatal   # gh 認証失敗・例外などはジョブを失敗させる

      - name: Write back issue numbers into plan.md
        run: |
          if ! git diff --quiet -- 'specs/**/plan.md'; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(asdd): sync issue numbers into plan.md [skip ci]"
            # 相手の書き戻しと競合しても落とさない(直列化していても、他の push と重なりうる)
            git pull --rebase --quiet && git push
          fi
