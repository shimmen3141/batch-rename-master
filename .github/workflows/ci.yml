name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# 同一ブランチへの連続 push で古い実行をキャンセルし、CI 時間を節約する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6" # .metadata の revision に合わせて固定(pubspec.yaml environment.sdk: ^3.12.2 を満たすバージョン)
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
