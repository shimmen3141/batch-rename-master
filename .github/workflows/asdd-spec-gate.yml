# PR が触った仕様が draft のままマージされるのを止めるゲート。
#
# なぜ CI か: 「仕様の approved 化は人間が行う」は規約(散文)でしか守られておらず、
# マージボタンは散文を読まない。実運用では仕様作成タスク(T1)の PR を spec が draft の
# まま統合し、承認を別 PR で後追いする手戻りが起きた。
#
# **このファイルは雛形であり、そのままコピーしない。** プレースホルダは設定から埋める:
#
#   python <plugin>/skills/asdd-setup/scripts/asdd_config.py render spec-gate \
#     > .github/workflows/asdd-spec-gate.yml
#
# 加えて skills/create-verifiable-spec/scripts/spec_status_gate.py を .github/scripts/ にコピーする。
# 効かせるには、リポジトリ設定 > Branches でこのチェックを required status check にする
# (そうしないと赤いだけでマージできてしまう)。
name: ASDD spec gate

on:
  pull_request:
    branches: [dev]
    paths: ["specs/**/spec.md", "specs/**/behavior-contract.json"]

permissions:
  contents: read

jobs:
  spec-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # base との差分を取るため

      - name: Fail if a touched spec is still draft (or was deleted)
        run: |
          git diff --name-status ${{ github.event.pull_request.base.sha }}...HEAD \
            | python .github/scripts/spec_status_gate.py
