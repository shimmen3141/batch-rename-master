# AI エージェント用コンテナ。本物の secrets/ は見せず、ダミー値だけを渡す。
#
# このファイルは必ず単独で使う: docker compose -f compose.ai.yml ...
# compose.yml との連結マージ(-f compose.yml -f compose.ai.yml)は本物の
# env_file やマウントを継承して隔離が壊れるため禁止。
name: batch-rename-master-ai # 実行用スタックとプロジェクト名を分け、down --remove-orphans の巻き添えを防ぐ
services:
  ai-dev:
    build:
      context: .devcontainer
    working_dir: /workspace
    # devcontainer の remoteUser だけでなく compose run/exec も非 root にする(root は iptables で firewall を解除できる)
    user: "dev"
    # init-firewall.sh(egress allowlist)に必要
    # NET_ADMIN のみ。SYS_ADMIN は絶対に追加しない — コンテナ内 root が umount できるようになり、
    # secrets/ のダミー差し替えマウントを AI 自身が剥がして本物を露出できる(検証済み)
    cap_add:
      - NET_ADMIN
    volumes:
      - ./:/workspace
      # 隔離設定自体を AI が書き換えられないよう read-only で覆う(fail-open 対策)
      - ./compose.ai.yml:/workspace/compose.ai.yml:ro
      - ./.devcontainer:/workspace/.devcontainer:ro
      # 言語キャッシュはホスト bind から分離(Windows ホストの性能・ネイティブバイナリ互換)
      - dart_tool:/workspace/.dart_tool
      - flutter_build:/workspace/build
      - pub_cache:/workspace/.pub-cache
      # AI エージェント CLI のログイン・設定の永続化(Rebuild してもログインが消えない)
      - claude_config:/home/dev/.claude
      - codex_config:/home/dev/.codex
      # 各メンバーのホスト側 skills / agents を読み取り専用で共有(--share-skills)。
      # ~ は compose が各メンバーのホームに展開する — 個人の絶対パスをコミットしない。
      # ホストの ~/.claude 全体は絶対にマウントしない(資格情報・履歴を持ち込む)。
      # :ro 必須 — コンテナ内 AI が skill を書き換えると、ホスト側で使ったとき汚染指示が実行される
      - ~/.agents/skills:/home/dev/.claude/skills:ro
      - ~/.claude/agents:/home/dev/.claude/agents:ro
      - ~/.agents/skills:/home/dev/.agents/skills:ro
      # 本物の secrets/ をダミー実体(secrets.example)で覆い隠す(深いパスのマウントが勝つ)。
      # secrets.example/.dummy-marker を check-secrets.sh が毎起動照合し、この行が消えた場合(fail-open)を検出する
      - ./secrets.example:/workspace/secrets:ro
    env_file:
      - secrets/ai.env
    environment:
      PUB_CACHE: /workspace/.pub-cache # pub のキャッシュ先を volume に固定
      # サンドボックス内であることの機械判定用マーカー(CLAUDE.md の前提ブロックが参照する)
      AI_SANDBOX: "1"
      # CLI は root 所有の npm prefix に焼き込んであり、非 root の実行ユーザーは書けない。
      # 自動更新は必ず失敗するので止め、更新はイメージの再ビルドで行う(構成を再現可能に保つ意味もある)
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      GIT_AUTHOR_NAME: ai-dev
      GIT_AUTHOR_EMAIL: ai-dev@example.local
      GIT_COMMITTER_NAME: ai-dev
      GIT_COMMITTER_EMAIL: ai-dev@example.local
    command: sleep infinity

volumes:
  dart_tool:
  flutter_build:
  pub_cache:
  claude_config:
  codex_config:
